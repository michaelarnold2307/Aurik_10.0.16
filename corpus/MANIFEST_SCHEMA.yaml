# Corpus Manifest Schema — Aurik 10.0.0
# §15.2 Echt-Audio-Corpus: Jedes Unterverzeichnis (shellac, vinyl, …) führt eine
# manifest.yaml nach diesem Schema. Validierung via tests/corpus/test_corpus_integrity.py
#
# Erforderliche Felder pro Eintrag: file, duration_s, sample_rate, material, era, genre
# Optionale Felder: defect_types, source_url, license, source_attribution, checksum_sha256

$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Aurik Corpus Manifest"
type: object
required: [corpus_version, material, entries]
properties:
  corpus_version:
    type: string
    description: "SemVer der Manifest-Version (zur Erkennung von Schema-Änderungen)"
    default: "1.0.0"
  material:
    type: string
    description: "Material-Kategorie (shellac, vinyl, tape, reel_tape, cassette, digital)"
    enum: [shellac, vinyl, tape, reel_tape, cassette, digital]
  description:
    type: string
    description: "Freitext-Beschreibung des Untercorpus"
  entries:
    type: array
    minItems: 1
    items:
      type: object
      required: [file, duration_s, sample_rate, material, era_year, genre]
      properties:
        file:
          type: string
          description: "Pfad relativ zum manifest.yaml-Verzeichnis (z.B. damaged/jazz_1950s_scratched.wav)"
        duration_s:
          type: number
          minimum: 0.5
          description: "Dauer in Sekunden"
        sample_rate:
          type: integer
          enum: [8000, 11025, 16000, 22050, 32000, 44100, 48000, 88200, 96000, 176400, 192000]
        material:
          type: string
          enum: [shellac, vinyl, tape, reel_tape, cassette, dat, cd_digital, mp3_low, mp3_high, aac, minidisc, streaming, lacquer_disc, wax_cylinder, wire_recording, unknown]
        era_year:
          type: integer
          minimum: 1877
          maximum: 2026
          description: "Aufnahmejahr (nicht Jahr der Digitalisierung)"
        genre:
          type: string
          description: "Genre (z.B. jazz, classical, rock, schlager, pop, blues, folk, electronic)"
        defect_types:
          type: array
          items:
            type: string
          description: "Bekannte Defekttypen (z.B. [hiss, clicks, wow_flutter, crackle, dropout])"
        condition:
          type: string
          enum: [clean, damaged, restored]
          description: "Zustand: clean (Referenz), damaged (defekt), restored (nach Aurik-Verarbeitung)"
        source_url:
          type: string
          format: uri
          description: "URL der Quelle (Internet Archive, Musopen, Freesound, …)"
        source_attribution:
          type: string
          description: "Urheber-Angabe (Autor, Ensemble, Aufnahmejahr, Quelle)"
        license:
          type: string
          description: "Lizenz (Public Domain, CC0, CC BY 4.0, CC BY-SA 4.0, …)"
        checksum_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: "SHA-256 der Audiodatei"
        channels:
          type: integer
          enum: [1, 2]
          default: 2
        bit_depth:
          type: integer
          enum: [16, 24, 32]
          default: 16
        vocal:
          type: boolean
          default: true
          description: "Enthält Gesang (true) oder rein instrumental (false)"
        language:
          type: string
          description: "Sprache des Gesangs (ISO 639-1), falls zutreffend"
