name: Aurik CI Lite

on:
  push:
    branches:
      - main
      - clean/**
      - dev/**
  pull_request:
    branches:
      - main

jobs:
  pr-evidence-gate:
    name: PR Evidence Gate (Spec Changes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require evidence block for spec changes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_specs="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep '^.github/specs/' || true)"
          if [[ -z "$changed_specs" ]]; then
            echo "No spec changes detected; evidence gate skipped."
            exit 0
          fi

          echo "Spec changes detected:"
          echo "$changed_specs"

          missing=0
          for token in "## Evidenzblock" "Seed" "95 %-CI" "Maintainer Sign-off"; do
            if ! grep -Fq "$token" <<< "$PR_BODY"; then
              echo "Missing PR body token: $token"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Spec changes require a complete evidence block in PR description."
            echo "Template: docs/guides/SPEC_EVIDENZBLOCK_TEMPLATE.md"
            exit 1
          fi

  determinism-gate:
    name: Determinism Gate (Normative)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/requirements_dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements_dev.txt

      - name: Run deterministic normative tests
        run: |
          python -m pytest \
            tests/normative/test_full_pipeline_determinism.py \
            tests/normative/test_p2_audit_and_deployment_mode.py \
            -p no:xdist \
            --override-ini="addopts=--strict-markers --import-mode=importlib" \
            --timeout=30 \
            --tb=short \
            -q \
            --disable-warnings \
            --no-header

  normative-guard:
    name: Normative Guard (No Production Stubs)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/requirements_dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements_dev.txt
          # tests/conftest.py imports numpy, so install it explicitly for the guard run.
          pip install numpy==1.26.4
          # tests/test_utils.py imports scipy.signal for fixture utilities.
          pip install scipy==1.15.3

      - name: Run normative CI guard tests
        run: |
          python -m pytest tests/normative/test_no_production_stubs.py \
            -p no:xdist \
            --override-ini="addopts=--strict-markers --import-mode=importlib" \
            --timeout=30 \
            --tb=short \
            -q \
            --disable-warnings \
            --no-header

      - name: VERBOTEN-Regeln Compliance-Check
        run: |
          python scripts/compliance_check.py --errors-only

  scope-lint-gate:
    name: Scope Lint Gate (§v10 A2)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/requirements_dev.txt

      - name: Install pylint
        run: pip install pylint

      - name: Run undefined-variable check (backend/core/phases)
        run: |
          pylint backend/core/phases/ \
            --enable=undefined-variable,used-before-assignment \
            --disable=all \
            --output-format=text \
            --exit-zero \
          | tee /tmp/pylint_scope.txt

      - name: Fail on new scope bugs
        run: |
          if grep -q "undefined-variable\|used-before-assignment" /tmp/pylint_scope.txt; then
            echo "Scope-Bugs gefunden:"
            grep "undefined-variable\|used-before-assignment" /tmp/pylint_scope.txt
            exit 1
          fi
          echo "Keine Scope-Bugs — Gate passed"

  type-gate:
    name: Type Gate (mypy)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        run: mypy --config-file pyproject.toml . --show-error-codes 2>&1 | tee /tmp/mypy_ci.txt

      - name: Fail on type errors
        run: |
          if grep -q ': error:' /tmp/mypy_ci.txt; then
            echo "Type-Errors gefunden:"
            grep ': error:' /tmp/mypy_ci.txt | head -20
            exit 1
          fi
          echo "0 Type-Errors — Gate passed"

  lint-gate:
    name: Lint Gate (ruff)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check backend/ Aurik10/ --output-format=text 2>&1 | tee /tmp/ruff_ci.txt

      - name: Fail on lint errors
        run: |
          if grep -qE '[A-Z][0-9]+' /tmp/ruff_ci.txt; then
            echo "Lint-Fehler gefunden:"
            head -20 /tmp/ruff_ci.txt
            exit 1
          fi
          echo "0 Lint-Fehler — Gate passed"
